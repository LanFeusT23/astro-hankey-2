name: Deploy Firebase Hosting Preview

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - closed

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: firebase-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    deploy-preview:
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        env:
            PREVIEW_CHANNEL_TTL: 3d
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Build SSR site (preview)
              run: npm run build
              env:
                  NUXT_IMAGE_REPOSITORY: firebase
                  NUXT_PUBLIC_APP_ENV: staging
                  NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NUXT_PUBLIC_FIREBASE_API_KEY }}
                  NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                  NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
                  NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                  NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                  NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_APP_ID }}
            - name: Authenticate with Google
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - name: Deploy preview channel
              id: deploy
              run: |
                  set -euo pipefail

                  CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
                  DEPLOY_OUTPUT="$(npx firebase-tools hosting:channel:deploy "$CHANNEL_ID" \
                      --config firebase.staging.json \
                      --project "${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
                      --expires "$PREVIEW_CHANNEL_TTL" \
                      --non-interactive \
                      --json)"

                  echo "$DEPLOY_OUTPUT"

                  PREVIEW_URL="$(printf '%s' "$DEPLOY_OUTPUT" | node -e '
                  const fs = require("fs")

                  const input = fs.readFileSync(0, "utf8")
                  const payload = JSON.parse(input)
                  const findUrl = (value) => {
                      if (typeof value?.url === "string") {
                          return value.url
                      }

                      if (Array.isArray(value)) {
                          for (const item of value) {
                              const nestedUrl = findUrl(item)

                              if (nestedUrl) {
                                  return nestedUrl
                              }
                          }

                          return undefined
                      }

                      if (value && typeof value === "object") {
                          for (const nestedValue of Object.values(value)) {
                              const nestedUrl = findUrl(nestedValue)

                              if (nestedUrl) {
                                  return nestedUrl
                              }
                          }
                      }

                      return undefined
                  }

                  const url = findUrl(payload?.result) ?? findUrl(payload)

                  if (url) {
                      process.stdout.write(url)
                  }
                  ')"

                  if [[ -z "$PREVIEW_URL" ]]; then
                      echo "::error::Failed to extract Firebase preview URL from deployment output."
                      exit 1
                  fi

                  echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            - name: Comment preview URL on PR
              uses: actions/github-script@v7
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
              with:
                  script: |
                      const marker = '<!-- firebase-preview-url -->'
                      const body = `${marker}\n🚀 Firebase preview ready: ${process.env.PREVIEW_URL}`
                      const { owner, repo } = context.repo
                      const issue_number = context.issue.number

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner,
                        repo,
                        issue_number,
                      })

                      const existing = comments.find((comment) =>
                        comment.user?.type === 'Bot' && comment.body?.includes(marker)
                      )

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body,
                        })
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number,
                          body,
                        })
                      }

    cleanup-preview:
        if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Authenticate with Google
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - name: Delete preview channel
              run: |
                  set -euo pipefail

                  CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
                  set +e
                  DELETE_OUTPUT="$(npx firebase-tools hosting:channel:delete "$CHANNEL_ID" \
                      --config firebase.staging.json \
                      --project "${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
                      --force \
                      --non-interactive \
                      --json 2>&1)"
                  DELETE_STATUS=$?
                  set -e

                  if [[ $DELETE_STATUS -ne 0 ]]; then
                      CHANNEL_EXISTS="$(CHANNEL_ID="$CHANNEL_ID" npx firebase-tools hosting:channel:list \
                          --config firebase.staging.json \
                          --project "${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
                          --json | node -e '
                          const fs = require("fs")

                          const input = fs.readFileSync(0, "utf8")
                          const payload = JSON.parse(input)
                          const channels = payload?.result?.channels ?? []
                          const channelId = process.env.CHANNEL_ID
                          const exists = channels.some(
                              (channel) =>
                                  typeof channel?.name === "string" &&
                                  channel.name.endsWith(`/channels/${channelId}`)
                          )

                          process.stdout.write(String(exists))
                          ')"

                      if [[ "$CHANNEL_EXISTS" == "false" ]]; then
                          echo "Preview channel $CHANNEL_ID was already removed or does not exist."
                      else
                          echo "$DELETE_OUTPUT"
                          exit $DELETE_STATUS
                      fi
                  else
                      echo "$DELETE_OUTPUT"
                  fi
