name: Deploy Firebase Hosting Preview

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - closed

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: firebase-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    deploy-preview:
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Generate static site (preview)
              run: npm run generate
              env:
                  NUXT_IMAGE_REPOSITORY: firebase
                  NUXT_PUBLIC_APP_ENV: staging
                  NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NUXT_PUBLIC_FIREBASE_API_KEY }}
                  NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                  NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
                  NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                  NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                  NUXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NUXT_PUBLIC_FIREBASE_APP_ID }}
            - name: Authenticate with Google
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - name: Deploy preview channel
              id: deploy
              run: |
                  set -euo pipefail

                  CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
                  DEPLOY_OUTPUT="$(npx firebase-tools hosting:channel:deploy "$CHANNEL_ID" --config firebase.staging.json --project "${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}" --expires 7d --non-interactive 2>&1)"

                  echo "$DEPLOY_OUTPUT"

                  PREVIEW_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | grep 'web.app' | head -n 1 || true)"

                  if [[ -z "$PREVIEW_URL" ]]; then
                      echo "::error::Failed to extract Firebase preview URL from deployment output."
                      exit 1
                  fi

                  echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            - name: Comment preview URL on PR
              uses: actions/github-script@v7
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
              with:
                  script: |
                      const marker = '<!-- firebase-preview-url -->'
                      const body = `${marker}\n🚀 Firebase preview ready: ${process.env.PREVIEW_URL}`
                      const { owner, repo } = context.repo
                      const issue_number = context.issue.number

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner,
                        repo,
                        issue_number,
                      })

                      const existing = comments.find((comment) =>
                        comment.user?.type === 'Bot' && comment.body?.includes(marker)
                      )

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body,
                        })
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number,
                          body,
                        })
                      }

    cleanup-preview:
        if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Authenticate with Google
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - name: Delete preview channel
              run: |
                  set -euo pipefail

                  CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
                  npx firebase-tools hosting:channel:delete "$CHANNEL_ID" --site astro-hankey-staging --project "${{ secrets.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}" --force --non-interactive || \
                      echo "Preview channel $CHANNEL_ID was already removed or does not exist."
